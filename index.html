<style>
html,body{margin:0;height:100%;background:#0b0e1a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#c{position:absolute;background:#000}
#ui{position:absolute;inset:0;pointer-events:none;display:none}
#ui.on{display:block}
#rot{position:absolute;left:0;width:100%;text-align:center;color:#ffcc33;font:bold 13px monospace;line-height:1.6;display:none}
#dpad{position:absolute;pointer-events:auto;touch-action:none}
#padBtn{position:absolute;display:none;z-index:5;font:bold 13px monospace;padding:8px 12px;border-radius:10px;border:2px solid #9fe0ff;background:#12203a;color:#9fe0ff}
#padTest{position:fixed;inset:0;display:none;z-index:12;background:rgba(5,7,20,.96);font-family:monospace;color:#fff;overflow:auto}
#padTestCard{max-width:720px;margin:0 auto;padding:12px}
#padTestCard h2{color:#ffcc33;margin:4px 0 8px;font-size:18px}
#padTestCard .pt{border:2px solid #33406a;border-radius:8px;padding:6px 8px;margin:6px 0;font-size:12px;line-height:1.5}
#padTestCard .pt.on{border-color:#7dff7a}
#padTestCard button{font:bold 15px monospace;padding:10px 14px;margin:6px 4px;border-radius:8px;border:2px solid #fff;background:#2f62c4;color:#fff}
#padTestCard .log{font-size:11px;color:#9fe0ff;white-space:pre-wrap}
#onlineBtn{position:absolute;display:none;z-index:5;font:bold 15px monospace;padding:10px 16px;border-radius:10px;border:3px solid #ffcc33;background:#1d2a5a;color:#ffcc33;letter-spacing:1px}
#lobby{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,20,.88);z-index:10;font-family:monospace;color:#fff}
#lobbyCard{background:#121a38;border:3px solid #ffcc33;border-radius:14px;padding:16px 18px;max-width:440px;width:88%;max-height:92vh;overflow:auto;text-align:center}
#lobbyCard h2{margin:2px 0 10px;color:#ffcc33;font-size:20px;letter-spacing:2px}
#lobbyCard p{margin:6px 0;color:#cfd8ff;font-size:13px}
#lobbyCard .code{font-size:40px;letter-spacing:10px;color:#ffcc33;margin:4px 0 8px;font-weight:bold}
#lobbyCard button{font:bold 16px monospace;padding:12px 14px;margin:5px;border-radius:10px;border:3px solid #fff;background:#2f62c4;color:#fff;min-width:130px}
#lobbyCard button.alt{background:#3a3f52}#lobbyCard button.go{background:#2f9a3a}
#lobbyCard input{font:bold 30px monospace;width:150px;text-align:center;letter-spacing:8px;text-transform:uppercase;padding:6px;border-radius:8px;border:3px solid #ffcc33;background:#0b0e1a;color:#ffcc33}
.picks{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:8px 0}
#lobbyCard .pick{width:80px;border:3px solid #33406a;border-radius:10px;padding:6px 2px;background:#0d1430;color:#fff;font:bold 13px monospace}
#lobbyCard .pick img{width:54px;height:60px;image-rendering:pixelated;display:block;margin:0 auto 4px}
#lobbyCard .pick.mine{border-color:#ffcc33;background:#2a3a7a}#lobbyCard .pick.taken{opacity:.45}
#lobbyCard .pick small{display:block;color:#9fe0ff;font-size:10px;min-height:12px}
#ui.ghost .dp,#ui.ghost #dC{opacity:.5}
#ui.ghost .b{opacity:.6}
#ui.ghost .dp.on,#ui.ghost .b.down{opacity:.9}
#ui.ghost .tb{opacity:.55}
#ui.pad .b,#ui.pad #dpad{display:none}
.dp{position:absolute;background:linear-gradient(#3a4052,#262a36);border:3px solid #5a6278;color:#cfd6e6;display:flex;align-items:center;justify-content:center;font:bold 22px sans-serif;border-radius:12px;box-sizing:border-box;box-shadow:0 4px 0 #11131a}
.dp.on{background:#ffcc33;color:#222;border-color:#fff;box-shadow:0 1px 0 #11131a;transform:translateY(3px)}
#dC{position:absolute;background:#262a36;border-radius:6px}
.b{position:absolute;border-radius:50%;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;font:bold 19px sans-serif;color:#fff;border:4px solid rgba(255,255,255,.75);box-sizing:border-box;box-shadow:0 5px 0 rgba(0,0,0,.55);text-shadow:0 2px 0 rgba(0,0,0,.4);touch-action:none}
.b small{font-size:10px;font-weight:bold;margin-top:-2px}
.b.down{filter:brightness(1.35);transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.55)}
#bA{background:radial-gradient(circle at 40% 35%,#ff6a55,#c4321f)}
#bJ{background:radial-gradient(circle at 40% 35%,#5aa2ff,#1f5ac4)}
#bS{background:radial-gradient(circle at 40% 35%,#ffd85a,#d49a10);color:#3a2400;text-shadow:none}
.tb{position:absolute;width:38px;height:38px;border-radius:8px;pointer-events:auto;display:flex;align-items:center;justify-content:center;font:bold 15px monospace;color:#fff;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.35)}
</style>
